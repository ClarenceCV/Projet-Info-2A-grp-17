# Projet backend : l'API FastAPI, l'import ILOSTAT, les services et l'accès à la base.
# Toutes les commandes `uv` du backend se lancent depuis le dossier backend/ (ou un sous-dossier).

[project]
name = "laborscope-backend"
version = "0.1.0"
description = "LaborScope API: ILOSTAT import, labour market analyses, user accounts - ENSAI 2A group 17"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",             # hachage des mots de passe
    "fastapi>=0.142.2",          # API REST
    "fpdf2>=2.9.0",              # rapport PDF (FO3)
    "matplotlib>=3.11.2",        # graphique du rapport PDF
    "pandas",                    # traitement des données
    "psycopg2-binary",           # connexion à PostgreSQL
    "pycountry_convert",         # pays -> continent (carte)
    "python-dotenv",             # lecture du fichier .env
    "pyyaml>=6.0.3",             # configuration des logs
    "requests",                  # téléchargement depuis l'API ILOSTAT
    "uvicorn>=0.54.0",           # serveur qui fait tourner l'API
    "worldcountrygroups",        # regroupements de pays
]

[dependency-groups]
# outils de développement, installés aussi par `uv sync`
dev = [
    "httpx>=0.28.1",             # requis par le TestClient de FastAPI
    "pylint>=4.1.4",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]         # pour écrire `from dao...` dans les tests, comme dans le code
testpaths = ["src/tests"]    # `uv run pytest` sans argument lance tous les tests
addopts = "-rs"              # affiche la raison des tests ignorés (ex : base injoignable)

[tool.ruff]
line-length = 100            # même limite que pylint

[tool.pylint.main]
# psycopg2.errors est créé à l'exécution (module écrit en C) : pylint ne peut pas en lire le contenu
# et croirait à tort que psycopg2.errors.UniqueViolation n'existe pas
ignored-modules = ["psycopg2.errors"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# les fonctions de test n'ont pas besoin de docstring : leur nom décrit déjà le cas testé
# (ex : test_creer_compte_mot_de_passe_trop_court) ; les modules et fixtures en ont une
no-docstring-rgx = "^(_|test_)"

[tool.pylint.design]
# routes de filtrage (indicateur, pays, période min/max, sexe, classif1, limite) : 7 paramètres
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",  # un service = une classe, même s'il n'a qu'une méthode (architecture en couches)
]

# Projet frontend : l'interface Streamlit, qui appelle l'API du backend.
# Toutes les commandes `uv` du frontend se lancent depuis le dossier frontend/.

[project]
name = "laborscope-frontend"
version = "0.1.0"
description = "LaborScope web interface (Streamlit) - ENSAI 2A group 17"
requires-python = ">=3.12"
dependencies = [
    "pandas",                    # mise en forme des données reçues de l'API
    "plotly>=7.1.0",             # graphiques interactifs
    "python-dotenv",             # lecture du fichier .env (adresse de l'API)
    "requests",                  # appels à l'API
    "streamlit>=1.66.1",         # interface web
]

[dependency-groups]
dev = [
    "pylint>=4.1.4",
]

[tool.ruff]
line-length = 100            # même limite que pylint

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# Une page Streamlit est un script exécuté de haut en bas à chaque clic : ses variables de niveau
# module (ex : colonne_y) sont des variables ordinaires, pas des constantes. On accepte donc aussi
# le snake_case pour elles (les vraies constantes restent en MAJUSCULES, ex : LIMITE).
const-rgx = "(([A-Z_][A-Z0-9_]*)|([a-z_][a-z0-9_]*))$"

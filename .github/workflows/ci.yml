name: pipeline

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-backend-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync backend dependencies
        run: uv sync --project backend --all-extras

      - name: Run service tests with coverage
        run: |
          uv run --project backend coverage run -m pytest backend/tests/service
          uv run --project backend coverage report

      - name: Lint backend with Ruff
        run: uv run --project backend ruff check backend/src backend/tests

      - name: Security scan backend
        run: uv run --project backend bandit -r backend/src
[project]
name = "laborscope"
version = "0.1.0"
description = "LaborScope : analyse interactive du marché du travail mondial (ILOSTAT) - ENSAI 2A groupe 17"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "pycountry_convert",
    "worldcountrygroups",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "bcrypt>=5.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "fpdf2>=2.9.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff>=0.17.3",
]


[tool.pytest.ini_options]
pythonpath = ["backend/src"]       # pour écrire `from dao...` dans les tests, comme dans le code
testpaths = ["backend/src/tests"]  # `uv run pytest` sans argument lance tous les tests
addopts = "-rs"                    # affiche la raison des tests ignorés (ex : base injoignable)

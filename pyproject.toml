[project]
name = "laborscope"
version = "0.1.0"
description = "LaborScope : analyse interactive du marché du travail mondial (ILOSTAT) - ENSAI 2A groupe 17"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "pycountry_convert",
    "worldcountrygroups",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
]


[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
